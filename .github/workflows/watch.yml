name: Watch for 512GB Mac Studio

# One long run checks every 5 minutes (Best Buy every 30) for ~5h45m, then starts the next run itself.
# The hourly schedule is only a backup that restarts the loop if it ever stops.
on:
  workflow_dispatch:
    inputs:
      announce:
        description: "Send a 'watcher is running' push when this run starts"
        type: boolean
        default: false
      test:
        description: "Only send a test notification"
        type: boolean
        default: false
  schedule:
    - cron: "23 * * * *"

permissions:
  actions: write   # to start the next run

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'mac-studio-512-780fbd66bfb1' }}   # repo secret wins if you add one
  END_DATE: "2026-11-02"       # Mac Studio watch ends (used by watch.py --test too)
  MAC_END_DATE: "2026-11-02"
  TV_END_DATE: "2026-11-30"    # Cyber Monday
  GH_TOKEN: ${{ github.token }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Skip if a watcher run is already going (backup schedule only)
        id: guard
        run: |
          busy=$(gh api "repos/${{ github.repository }}/actions/workflows/watch.yml/runs?status=in_progress" \
                 --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
          echo "busy=$busy" >> "$GITHUB_OUTPUT"
          [ "$busy" != "0" ] && echo "Another watcher run is active; this one exits." || true
      - name: Test notification
        if: inputs.test
        run: python3 watch.py --test
      - name: Restore state from the previous run
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Watch (every 5 minutes)
        id: loop
        if: steps.guard.outputs.busy == '0' && !inputs.test
        env:
          ANNOUNCE: ${{ inputs.announce && 'true' || 'false' }}
        run: |
          set +e
          python3 loop.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Save state for the next run
        if: always() && steps.loop.conclusion != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}
      - name: Start the next run
        # only after a real loop run: a skipped step's empty output compares equal to '0' in GitHub expressions
        if: steps.loop.outcome == 'success' && steps.loop.outputs.code == '0'
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/watch.yml/dispatches" -f ref=main
