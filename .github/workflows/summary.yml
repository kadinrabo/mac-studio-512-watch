name: Status summary

on:
  schedule:
    - cron: "7 * * * *"   # hourly; summary.py only sends at 8/11/14/17/20/23 New York time
  workflow_dispatch:
    inputs:
      force:
        description: "Send a summary now, whatever the time"
        type: boolean
        default: false

permissions:
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'mac-studio-512-780fbd66bfb1' }}
          END_DATE: "2026-11-02"
        run: python3 summary.py ${{ inputs.force && '--force' || '' }}
